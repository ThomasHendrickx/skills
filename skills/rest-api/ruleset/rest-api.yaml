# Zalando RESTful API guidelines (https://opensource.zalando.com/restful-api-guidelines/) as Spectral rules.
# Rule names carry the guideline number. MUST is error, SHOULD is warn. A deviation is an override in the
# repo's .spectral.yaml, with its reason, decided by the API owner.
extends: [[spectral:oas, off]]
formats: [oas3]
functionsDir: ./functions
functions: [zalando]
rules:
  # #101: a valid OpenAPI document.
  oas3-schema: error
  zalando-101-openapi-3:
    description: "MUST provide API specifications using OpenAPI (3.x) (#101)"
    documentationUrl: https://opensource.zalando.com/restful-api-guidelines/#101
    message: "{{error}}"
    severity: error
    formats: [oas2, oas3]
    given: $
    resolved: false
    then: { function: zalando, functionOptions: { check: openapi3 } }
  zalando-101-yaml-file:
    description: "MUST provide API specifications in a single self-contained YAML file (#101)"
    documentationUrl: https://opensource.zalando.com/restful-api-guidelines/#101
    message: "{{error}}"
    severity: error
    given: $
    resolved: false
    then: { function: zalando, functionOptions: { check: yamlFile } }
  zalando-234-durable-references:
    description: "MUST only use durable and immutable remote references (#234)"
    documentationUrl: https://opensource.zalando.com/restful-api-guidelines/#234
    message: "{{error}}"
    severity: error
    given: $
    resolved: false
    then: { function: zalando, functionOptions: { check: durableReferences } }
  zalando-102-user-manual:
