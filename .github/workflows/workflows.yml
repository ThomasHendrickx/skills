name: workflows
on:
  pull_request:
    paths:
      - workflows/**
      - .github/workflows/workflows.yml
  push:
    branches: [main]
    paths:
      - workflows/**
      - .github/workflows/workflows.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - run: python -m unittest -v test_validate
        working-directory: workflows
      - run: python validate.py *.yaml
        working-directory: workflows
